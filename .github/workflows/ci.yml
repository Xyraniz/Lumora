name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 was retired (jobs queued forever) and macos-14 is in its
        # deprecation window (unsupported from November 2026); the supported
        # set is macos-15 and macos-26.
        os: [ubuntu-22.04, ubuntu-24.04, macos-15, macos-26]
        compiler: [gcc, clang]
        build-type: [Release]
        exclude:
          # Apple Clang is the only supported system compiler on macOS; the
          # brew gcc would need version-pinned aliases. Keep the gcc/clang
          # dimension on Linux where it is real.
          - os: macos-15
            compiler: gcc
          - os: macos-26
            compiler: gcc
        include:
          # Add a Debug build on the primary Linux runner
          - os: ubuntu-22.04
            compiler: gcc
            build-type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang \
            libcurl4-openssl-dev libssl-dev libsodium-dev liblz4-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja curl openssl@3 libsodium lz4

      - name: Configure CMake
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BREW="$(brew --prefix)"
            COMMON_FLAGS="-I${BREW}/opt/curl/include -I${BREW}/opt/openssl@3/include -I${BREW}/opt/libsodium/include -I${BREW}/opt/lz4/include"
            LINK_FLAGS="-L${BREW}/opt/curl/lib -L${BREW}/opt/openssl@3/lib -L${BREW}/opt/libsodium/lib -L${BREW}/opt/lz4/lib"
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
              -DCMAKE_C_FLAGS="${COMMON_FLAGS}" \
              -DCMAKE_CXX_FLAGS="${COMMON_FLAGS}" \
              -DCMAKE_EXE_LINKER_FLAGS="${LINK_FLAGS}"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          fi
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Build & Test (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # windows-latest no longer ships vcvars64.bat at the old Enterprise
      # path (the VS install moved with the MSBuild 18 image), so MSVC enters
      # PATH through the msvc-dev-cmd action instead of a hard-coded call.
      # Dependencies (curl, OpenSSL, libsodium, LZ4) come from the vcpkg
      # instance preinstalled on the runner via its CMake toolchain file.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install curl openssl libsodium lz4 --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
